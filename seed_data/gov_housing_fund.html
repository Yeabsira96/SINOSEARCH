<main>
<h1>住房公积金常见问题解答</h1>
<p>问：在华就业的外国人是否需要缴存住房公积金？答：根据《关于在住房公积金制度中对外籍员工有关问题的指导意见》，在华就业的外籍人员及港、澳、台地区干部可以和用人单位协商缴存住房公积金；个人自愿缴存。</p>
<p>问：外国人离职离境时如何提取？答：与单位终止劳动关系的，可以提取本人住房公积金账户内的存储余额，账户予以注销。提取需提供护照、解除劳动关系证明等材料，可通过"全国住房公积金"小程序或柜台办理。</p>
<p>问：公积金贷款利率是多少？答：5年以上首套个人住房公积金贷款利率为2.85%，明显低于商业贷款。部分城市支持跨城互认互贷。</p>
