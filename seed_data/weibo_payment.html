<p>博主@在华生活指南：2025年实测，外国朋友来中国不需要再换一堆现金了。支付宝（Alipay）和微信支付（WeChat Pay）都支持绑定Visa/万事达境外银行卡，单笔2000元以下免手续费，超过部分收3%。</p>
<p>下载国际版App后可直接KYC：护照拍照+人脸识别，几分钟搞定。高铁票、共享单车、点餐、扫码付款全部可用。大额消费建议随身带张外卡备用，部分小商户仍只收人民币现金或个人收款码。</p>
<p>热评第一条：以前是"没身份证寸步难行"，现在"没手机一样寸步难行"，不过对游客确实友好多了。央行推动的"大额刷卡、小额扫码、现金兜底"政策正在落地，重点商圈已覆盖外币兑换机。</p>
