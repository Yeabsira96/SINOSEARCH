<title>小红书笔记：外国人上海租房避坑指南（附合同模板）</title></head>
<body>
<div class="note">
<p>很多外国朋友第一次在上海租房（租房）不知道水有多深，整理这份攻略：1）中介费通常是月租金的35%-50%由租客承担，可谈；2）只有"链家/自如"等大品牌支持线上押金退还，二房东风险高；3）租赁合同必须写明币种、押金退还条件（押一付三最常见）；4）办理居住登记：入住后24小时内到社区事务受理中心或通过"随申办"申报临时住宿登记，这是办签证延期、工作许可的前提！</p>
<p>评论区补充：长宁古北、静安大宁、浦东碧云是外籍人士聚集社区，房源挂牌价普遍比同地段高20%-30%，但配套国际学校多。看房记得查房产证原件。</p>
</div>
</body></html>
