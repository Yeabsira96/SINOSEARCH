<title>央广网：健康码时代结束了吗？回顾与现状</title></head>
<body>
<main>
<p>2022年末"新十条"发布后，健康码（健康码）退出日常场景，行程卡于2022年12月13日下线。目前入境中国无需健康申报，普通场所不再查验任何健康码。</p>
<p>但"数字化身份"的习惯保留了下来：乘车码、电子医保凭证、随申码（上海）等在医疗、交通场景继续使用。外国人来华常困惑的一点：随申码等地方级服务码现在支持护照注册，可在支付宝内搜索"健康频道"办理，就医挂号时仍然需要。</p>
</main>
