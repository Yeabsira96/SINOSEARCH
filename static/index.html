<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SinoSearch — China-native answers, in English</title>
<style>
  :root { --red:#c8102e; --ink:#1a1a1a; --mut:#666; --bg:#faf8f5; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans SC",sans-serif;
         background:var(--bg); color:var(--ink); }
  header { text-align:center; padding:48px 16px 8px; }
  h1 { margin:0; font-size:34px; } h1 .cn{ color:var(--red); }
  .tag { color:var(--mut); margin-top:6px; font-size:14px; }
  .box { max-width:720px; margin:24px auto; padding:0 16px; }
  form { display:flex; gap:8px; }
  input[type=search] { flex:1; padding:14px 16px; font-size:16px; border:2px solid #ddd;
        border-radius:10px; outline:none; background:#fff; }
  input:focus { border-color:var(--red); }
  button { padding:0 22px; border:none; border-radius:10px; background:var(--red);
           color:#fff; font-size:15px; cursor:pointer; }
  button.alt { background:#fff; color:var(--red); border:2px solid var(--red); }
  .modes { display:flex; gap:8px; margin-bottom:10px; font-size:13px; color:var(--mut); align-items:center;}
  .zhq { color:var(--mut); font-size:13px; margin:14px 0; }
  .answer { background:#fff; border:1px solid #eee; border-left:4px solid var(--red);
            border-radius:10px; padding:16px; white-space:pre-wrap; line-height:1.6; font-size:15px; }
  .card { background:#fff; border:1px solid #eee; border-radius:10px; padding:14px 16px; margin-top:12px; }
  .card a.t { font-weight:600; color:#0645ad; text-decoration:none; font-size:15px; }
  .meta { font-size:12px; color:var(--mut); margin-top:4px; }
  .src { display:inline-block; background:#fdecef; color:var(--red); border-radius:6px;
         padding:1px 8px; font-size:12px; margin-right:6px; }
  .snip { margin-top:8px; font-size:14px; color:#333; line-height:1.55; }
  .lane { float:right; font-size:11px; color:#999; }
  .empty { color:var(--mut); text-align:center; margin-top:30px; }
  footer { text-align:center; color:#aaa; font-size:12px; margin:40px 0; }
  .spinner:after { content:"搜索中…"; color:var(--mut); }
</style>
</head>
<body>
<header>
  <h1>Sino<span class="cn">搜</span>Search</h1>
  <div class="tag">Ask in English. We search the Chinese internet — 知乎 · gov.cn · 微博 · 小红书 — and answer with citations.</div>
</header>
<div class="box">
  <form id="f" onsubmit="return false;">
    <input type="search" id="q" placeholder="e.g. How do I get a Shanghai hukou?" autofocus>
    <button id="bAns">Answer</button>
    <button id="bSrc" class="alt">Sources</button>
  </form>
  <div class="modes" id="stats"></div>
  <div id="zhq" class="zhq"></div>
  <div id="out"></div>
</div>
<footer>SinoSearch MVP — hybrid BM25 + vector retrieval over Chinese sources, RRF fusion, cited synthesis.</footer>
<script>
const $ = id => document.getElementById(id);
async function api(path, body){
  const r = await fetch(path, {method:"POST", headers:{"Content-Type":"application/json"},
                               body: JSON.stringify(body)});
  if(!r.ok) throw new Error((await r.json()).detail || r.status);
  return r.json();
}
function esc(s){ const d=document.createElement("div"); d.textContent=s||""; return d.innerHTML; }
function card(c){
  return `<div class="card"><span class="lane">${esc(c.lane)} · ${c.score}</span>
    <a class="t" href="${esc(c.url)}" target="_blank" rel="noopener">[${c.n}] ${esc(c.title)||esc(c.domain)}</a>
    <div class="meta"><span class="src">${esc(c.source)||esc(c.domain)}</span>${esc(c.published)}</div>
    <div class="snip">${esc(c.snippet_zh)}</div></div>`;
}
async function run(mode){
  const q = $("q").value.trim(); if(!q) return;
  $("out").innerHTML = '<p class="spinner"></p>';
  try{
    if(mode==="answer"){
      const a = await api("/api/answer", {query:q});
      $("zhq").textContent = "Searching in Chinese as: " + a.query_zh + "  ·  mode: " + a.mode;
      $("out").innerHTML = `<div class="answer">${esc(a.answer)}</div>` +
                            a.citations.map(card).join("");
    } else {
      const s = await api("/api/search", {query:q});
      $("zhq").textContent = "Searching in Chinese as: " + s.query_zh;
      $("out").innerHTML = s.results.length ? s.results.map(card).join("")
                          : '<p class="empty">No results — ingest more pages first.</p>';
    }
  }catch(e){ $("out").innerHTML = '<p class="empty">Error: '+esc(e.message)+'</p>'; }
}
$("bAns").onclick = ()=>run("answer");
$("bSrc").onclick = ()=>run("search");
$("q").addEventListener("keydown", e=>{ if(e.key==="Enter") run("answer"); });
fetch("/api/stats").then(r=>r.json()).then(s=>{
  $("stats").textContent = `index: ${s.docs} docs / ${s.chunks} chunks · sources: `+
    (s.sources.map(x=>x.name+"("+x.docs+")").join(", ")||"—")+
    ` · embed:${s.providers.embed} translate:${s.providers.translate} llm:${s.providers.llm}`;
});
</script>
</body>
</html>
